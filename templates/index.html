<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopLite | Product Catalogue</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">ShopLite<span>.</span></a>
    <span class="tagline">Simple product catalogue</span>
  </header>

  <main class="container">
    <section class="intro">
      <p class="eyebrow">PRODUCT COLLECTION</p>
      <h1>Find something you’ll love.</h1>
      <p class="subheading">Browse our products and view the details.</p>
    </section>

    <section class="toolbar" aria-label="Product search and filter">
      <input id="searchInput" type="search" placeholder="Search products..." aria-label="Search products">
      <select id="categoryFilter" aria-label="Filter by category">
        <option value="">All categories</option>
        <option>Electronics</option>
        <option>Accessories</option>
        <option>Fashion</option>
        <option>Home</option>
      </select>
    </section>

    <p id="status" class="status" aria-live="polite">Loading products...</p>
    <section id="productGrid" class="product-grid" aria-label="Products"></section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <button id="closeModal" class="close-button" aria-label="Close details">&times;</button>
      <img id="modalImage" src="" alt="">
      <div class="modal-content">
        <p id="modalCategory" class="eyebrow"></p>
        <h2 id="modalTitle"></h2>
        <p id="modalDescription"></p>
        <p id="modalPrice" class="modal-price"></p>
      </div>
    </div>
  </div>

  <footer>ShopLite · Part 1 Product Listing Website</footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
